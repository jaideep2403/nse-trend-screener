<div id="tab-defensive" class="tab-content">
  <div class="tab-intro"><span class="ti-title">Defensive Leaders</span>Absolute-momentum gate, high-volatility tail dropped, then ranked by momentum, delivery and trend smoothness.</div>
<div class="container" style="padding-top:18px">

  <div class="panel">
    <div class="panel-header"><h2><svg class="ic ic-h"><use href="#i-shield"/></svg>Defensive Leaders — falls less, more alpha than momentum</h2>
      <span id="defMeta" style="font-size:var(--fs-xs);color:var(--text2)"></span></div>
    </div>

  <div class="panel">
    <div class="panel-header"><h2><svg class="ic ic-h"><use href="#i-shield"/></svg>Today's Defensive Leaders</h2>
      <button class="btn btn-primary" id="defBtn" onclick="defScan(true)"><svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh</button></div>
    <div class="panel-body">
      <div id="defBody"></div>
    </div>
  </div>

</div>

  <p class="disclaimer">{{ DISCLAIMER }}</p>
</div>

<script>
async function defScan(force) {
  const btn = document.getElementById('defBtn');
  const body = document.getElementById('defBody');
  if (force) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Scanning…'; }
  body.innerHTML = stateLoading(6);
  try {
    const d = await (await fetch('/api/defensive')).json();
    btn.disabled = false; btn.innerHTML = '<svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh';
    if (d.error) { body.innerHTML = stateError(d.error); return; }
    document.getElementById('defMeta').textContent = `${d.count} qualify · as of ${d.as_of}`;
    const col = v => v>=70?'var(--green2)':v>=40?'var(--gold2)':'var(--text2)';
    const rows = (d.stocks||[]).map((s,i) => `<tr>
      <td style="text-align:left"><span class="rank-badge">${i+1}</span></td>
      <td style="text-align:left"><span class="sym">${s.symbol}</span></td>
      <td class="num">${fmtINR(s.price)}</td>
      <td>${pctCell(s.r3m,1)}</td>
      <td title="Annualised realised volatility — lower = calmer, falls less">${s.vol_pct}%</td>
      <td title="Trend smoothness (efficiency ratio 0–1) — higher = frog-in-the-pan persistence">${s.smoothness}</td>
      <td title="Avg delivery % — institutional participation" style="color:${col(s.deliv_level)}">${s.deliv_level}%</td>
      <td title="Recent vs baseline delivery — >1 = rising delivery (accumulation)" style="color:${s.deliv_ratio>=1?'var(--green2)':'var(--text2)'}">${s.deliv_ratio}×</td>
      <td style="font-weight:700;font-family:var(--mono)">${s.score}</td>
      <td title="Inverse-volatility weight (vol-targeted sizing)">${s.weight_pct}%</td>
    </tr>`).join('');
    body.innerHTML = `<div class="tbl-scroll"><table><thead><tr>
      <th>#</th><th class="ta-l">Symbol</th><th>Price</th><th>3M ret</th>
      <th>Vol</th><th>Smooth</th><th>Deliv%</th><th>Deliv↑</th><th>Score</th><th>Wt</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch(e) {
    btn.disabled = false; btn.innerHTML = '<svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh';
    body.innerHTML = stateError('Scan failed.');
  }
}
</script>
