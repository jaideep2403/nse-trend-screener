<div id="tab-allweather" class="tab-content">
  <div class="tab-intro"><span class="ti-title">All-Weather Investing</span>Regime-switching book: offense in uptrends, defensive leaders when choppy, cash in a confirmed downtrend.</div>
<div class="container" style="padding-top:18px">

  <!-- ── Regime gauge ─────────────────────────────────────────────────── -->
  <div class="panel">
    <div class="panel-header">
      <h2><svg class="ic ic-h"><use href="#i-umbrella"/></svg>All-Weather Investing — one engine for every market</h2>
      <button class="btn btn-primary" id="awBtn" onclick="awLoad(true)"><svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh</button>
    </div>
  </div>

  <!-- ── Active engine picks ──────────────────────────────────────────── -->
  <div class="panel">
    <div class="panel-header">
      <h2><svg class="ic ic-h"><use href="#i-target"/></svg><span id="awPicksTitle">Today's Playbook</span></h2>
      <span id="awPicksMeta" style="font-size:var(--fs-xs);color:var(--text2)"></span>
    </div>
    <div class="panel-body">
      <div id="awPicks"></div>
    </div>
  </div>


</div>

  <p class="disclaimer">{{ DISCLAIMER }}</p>
</div>

<script>
// ── Regime → colour/emphasis helpers ────────────────────────────────────────
const AW_COLORS = { BULL:'var(--green2)', SIDEWAYS:'var(--gold2)', BEAR:'var(--red2)', UNKNOWN:'var(--text2)' };
const AW_BG     = { BULL:'rgba(16,185,129,.09)', SIDEWAYS:'rgba(234,179,8,.09)', BEAR:'rgba(239,68,68,.09)', UNKNOWN:'rgba(148,163,184,.08)' };
const AW_BORDER = { BULL:'rgba(16,185,129,.35)', SIDEWAYS:'rgba(234,179,8,.35)', BEAR:'rgba(239,68,68,.35)', UNKNOWN:'rgba(148,163,184,.25)' };

function awSeg(state){
  // 3-segment BULL / SIDEWAYS / BEAR strip with the active one lit
  const segs = ['BULL','SIDEWAYS','BEAR'];
  const lab  = {BULL:'BULL · Offense', SIDEWAYS:'SIDEWAYS · Defense', BEAR:'BEAR · Cash'};
  return `<div style="display:flex;gap:6px;margin:10px 0 2px">` + segs.map(s=>{
    const on = (s===state);
    return `<div style="flex:1;text-align:center;padding:7px 4px;border-radius:7px;font-size:var(--fs-xs);font-weight:700;
      letter-spacing:.3px;border:1px solid ${on?AW_BORDER[s]:'var(--border)'};
      background:${on?AW_BG[s]:'transparent'};color:${on?AW_COLORS[s]:'var(--text2)'};opacity:${on?1:.5}">
      ${lab[s]}</div>`;
  }).join('') + `</div>`;
}

function awStat(label, val, col){
  return `<div style="flex:1;min-width:104px">
    <div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.4px;color:var(--text2)">${label}</div>
    <div style="font-size:var(--fs-lg);font-weight:700;font-family:var(--mono);color:${col||'var(--text)'}">${val}</div></div>`;
}

function awRenderRegime(reg){
  // Regime banner removed 2026-08-03 at user request — it consumed a large block
  // above the picks. The regime still DRIVES the engine; it is just not rendered.
  return;
  const st = reg.state || 'UNKNOWN';
  const c = AW_COLORS[st];
  const pv = reg.pct_vs_ma200, r6 = reg.r6m_pct, dd = reg.drawdown_pct, vol = reg.vol_pct;
  const sign = v => (v>=0?'+':'') + v + '%';
  (document.getElementById('awRegime') || document.getElementById('awPicks') || {}).innerHTML = `
    <div style="border:1px solid ${AW_BORDER[st]};background:${AW_BG[st]};border-radius:10px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="width:10px;height:10px;border-radius:50%;background:${c};box-shadow:0 0 10px ${c}"></span>
        <span style="font-size:var(--fs-lg);font-weight:800;color:${c}">${reg.label||st}</span>
        <span style="font-size:var(--fs-xs);color:var(--text2)">NIFTYBEES as of ${reg.as_of||'—'} · in this regime ${reg.days_in_regime||'—'} sessions</span>
      </div>
      <div style="font-size:var(--fs-sm);color:var(--text);margin:8px 0 2px"><b>Action:</b> ${reg.action||''}</div>
      <div style="font-size:var(--fs-xs);color:var(--text2);line-height:1.5">${reg.why||''}</div>
      ${awSeg(st)}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        ${awStat('NIFTY vs 200-DMA', pv==null?'—':sign(pv), pv==null?null:(pv>=0?'var(--green2)':'var(--red2)'))}
        ${awStat('6-month momentum', r6==null?'—':sign(r6), r6==null?null:(r6>=0?'var(--green2)':'var(--red2)'))}
        ${awStat('Drawdown from 6M high', dd==null?'—':dd+'%', dd==null?null:(dd> -5?'var(--text)':'var(--red2)'))}
        ${awStat('Realized vol (90d)', vol==null?'—':vol+'%')}
      </div>
    </div>`;
}

function awRenderPicks(d){
  const st = d.state, meta = document.getElementById('awPicksMeta');
  const title = document.getElementById('awPicksTitle');
  const body = document.getElementById('awPicks');
  const col = v => v>=70?'var(--green2)':v>=40?'var(--gold2)':'var(--text2)';

  if (st === 'BULL' || st === 'SIDEWAYS') {
    title.textContent = (st === 'BULL')
      ? 'Risk-On — Defensive-Momentum Leaders (full deployment)'
      : 'Sideways — Defensive Leaders (staying invested, defensively)';
    body.innerHTML = awDefTable(d.picks);
    meta.textContent = `${(d.picks||[]).length} leaders · as of ${d.as_of||'—'}`;

  } else {  // BEAR / UNKNOWN
    title.textContent = 'Capital Preservation — Cash';
    meta.textContent = `as of ${d.as_of||'—'}`;
    let html = `<div style="border:1px solid ${AW_BORDER.BEAR};background:${AW_BG.BEAR};border-radius:9px;padding:12px 14px;margin-bottom:12px">
      <div style="font-size:var(--fs-md);font-weight:700;color:var(--red2)">Raise cash — do not initiate new longs.</div>
      <div style="font-size:var(--fs-xs);color:var(--text2);margin-top:4px;line-height:1.5">
        NIFTY is in a confirmed downtrend below its 200-DMA. The engine sits in cash here:
        the largest source of long-run edge in a bear market is the drawdown you don't take.
        In a real account you'd park this in a liquid / overnight fund.</div></div>`;
    if (d.secondary && d.secondary.length) {
      html += `<div style="font-size:var(--fs-xs);color:var(--text2);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.4px">
        If you must stay invested — the lowest-risk defensive names</div>` + awDefTable(d.secondary);
    }
    body.innerHTML = html;
  }
}

function awDefTable(picks){
  const col = v => v>=70?'var(--green2)':v>=40?'var(--gold2)':'var(--text2)';
  const qcol = q => q>=0.66?'var(--green2)':q>=0.4?'var(--gold2)':'var(--text2)';
  const hasQ = (picks||[]).some(s => s.quality != null || s.roe != null);
  const rows = (picks||[]).map((s,i) => `<tr>
    <td style="text-align:left"><span class="rank-badge">${i+1}</span></td>
    <td style="text-align:left"><span class="sym">${s.symbol}</span></td>
    <td class="num">${fmtINR(s.price)}</td>
    <td>${pctCell(s.r3m,1)}</td>
    <td title="Annualised realised volatility — lower = calmer">${s.vol_pct}%</td>
    <td title="Trend smoothness (efficiency ratio)">${s.smoothness}</td>
    <td title="Avg delivery % — institutional participation" style="color:${col(s.deliv_level)}">${s.deliv_level}%</td>
    ${hasQ ? `<td title="Return on equity — profitability" style="color:${s.roe>=15?'var(--green2)':'var(--text2)'}">${s.roe==null?'—':s.roe+'%'}</td>
    <td title="Earnings growth (3Y CAGR / TTM)" style="color:${s.earn_growth>=0?'var(--green2)':'var(--red2)'}">${s.earn_growth==null?'—':(s.earn_growth>=0?'+':'')+s.earn_growth+'%'}</td>
    <td title="QMJ-style quality percentile (profitability + growth + earnings acceleration + promoter holding)" style="font-weight:700;color:${qcol(s.quality)}">${s.quality==null?'—':Math.round(s.quality*100)}${s.earn_accel===1?' ▲':''}</td>
    <td title="F&amp;O open-interest positioning — how leveraged money is positioned (point-in-time, no look-ahead)" style="font-size:var(--fs-micro);font-weight:600;color:${s.flow==null?'var(--text2)':s.flow>=0.9?'var(--green2)':s.flow>=0.6?'var(--green2)':s.flow<=0.1?'var(--red2)':s.flow<0.5?'var(--gold2)':'var(--text2)'}">${s.flow_label==null||s.flow_label==='NO F&O'?'—':s.flow_label}</td>` : ''}
    <td style="font-weight:700;font-family:var(--mono)">${s.score}</td>
    <td title="Inverse-vol weight">${s.weight_pct}%</td></tr>`).join('');
  return (picks||[]).length ? `<div class="tbl-scroll"><table><thead><tr>
    <th>#</th><th class="ta-l">Symbol</th><th>Price</th><th>3M ret</th>
    <th>Vol</th><th>Smooth</th><th>Deliv%</th>${hasQ?'<th>ROE</th><th>Earn gr</th><th title="Quality percentile · ▲ = earnings accelerating">Qual</th><th title="F&O open-interest positioning of leveraged money">F&O Flow</th>':''}<th>Score</th><th>Wt</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`
    : stateEmpty('No qualifying leaders', 'The gate is strict — this is normal in weak tape.');
}

async function awLoad(force){
  const btn = document.getElementById('awBtn');
  if (force) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Reading…'; }
  const _pb=document.getElementById('awPicks'); if(_pb) _pb.innerHTML = stateLoading(6);
  try {
    const d = await (await fetch('/api/allweather')).json();
    btn.disabled = false; btn.innerHTML = '<svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh';
    if (d.error) { (document.getElementById('awRegime') || document.getElementById('awPicks') || {}).innerHTML =
      `<span style="color:var(--red2);font-size:var(--fs-sm)">${d.error}</span>`; return; }
    awRenderRegime(d.regime||{});
    awRenderPicks(d);
  } catch(e) {
    btn.disabled = false; btn.innerHTML = '<svg class="ic ic-b"><use href="#i-refresh"/></svg>Refresh';
    (document.getElementById('awRegime') || document.getElementById('awPicks') || {}).innerHTML =
      '<span style="color:var(--red2);font-size:var(--fs-sm)">Failed to read regime.</span>';
  }
}
</script>
