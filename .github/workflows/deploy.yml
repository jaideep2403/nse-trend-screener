name: Deploy to EC2 (SSH + Docker)

# Simple deploy: SSH to the box, pull v2, rebuild the image, restart the container.
# No ECR / no SSM / no AWS IAM — matches the "pull from GitHub + run the Dockerfile"
# decision. Replaces the old ECR+SSM pipeline (kept in git history).
#
# ── ONE-TIME SETUP (only the repo owner can do these; they involve a credential) ──
#   1. On a machine with the box's key, create a deploy keypair (or reuse one):
#        ssh-keygen -t ed25519 -f deploy_key -N ""
#      Put the PUBLIC half on the EC2:
#        ssh <user>@32.197.240.72 'cat >> ~/.ssh/authorized_keys' < deploy_key.pub
#   2. Add GitHub repo secrets (Settings → Secrets and variables → Actions):
#        EC2_SSH_KEY        = contents of the PRIVATE key file (deploy_key)
#        EC2_USER           = ec2-user   (Amazon Linux)  OR  ubuntu  (Ubuntu AMI)
#        ASCENT_ADMIN_PASS  = your admin password  (optional; demo login works without it)
#   3. On the box (once): Docker installed, the ssh user in the `docker` group,
#      /opt/ascent cloned, and /var/lib/ascent holding the bhavcopy cache.
#
# After that, every push to v2 (without [skip ci]) OR a manual "Run workflow"
# deploys automatically.

on:
  push:
    branches: [v2]
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  EC2_HOST: "32.197.240.72"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ASCENT_ADMIN_PASS: ${{ secrets.ASCENT_ADMIN_PASS }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # keep the private key out of the shell log; pass the password via env
          envs: ASCENT_ADMIN_PASS
          command_timeout: "20m"
          script: |
            set -euo pipefail
            REPO=/opt/ascent
            # first deploy clones; later deploys pull
            if [ ! -d "$REPO/.git" ]; then
              sudo mkdir -p "$REPO" && sudo chown "$USER":"$USER" "$REPO"
              git clone https://github.com/jaideep2403/nse-trend-screener.git "$REPO"
            fi
            cd "$REPO"
            git config --global --add safe.directory "$REPO"
            git fetch origin v2
            git reset --hard origin/v2          # exact match to the pushed code
            git log --oneline -1

            docker build -t ascentx:latest .

            docker rm -f ascentx 2>/dev/null || true
            docker run -d --name ascentx --restart unless-stopped \
              -p 127.0.0.1:5050:5050 \
              -v /var/lib/ascent:/data \
              -e ASCENT_ENV=production \
              -e ASCENT_BACKGROUND_JOBS=1 \
              -e ASCENT_DEMO_PASS=demo123 \
              -e ASCENT_ADMIN_PASS="${ASCENT_ADMIN_PASS:-}" \
              ascentx:latest

            docker image prune -f || true
            echo "Deployed $(git rev-parse --short HEAD). Prewarm runs for ~90s; nginx proxies 80/443 -> 127.0.0.1:5050."
