# nginx site for Ascent Wealth Labs.
# Route53 A/AAAA record -> this EC2's Elastic IP. No Cloudflare, so TLS terminates
# here and this is the only public listener; gunicorn stays on 127.0.0.1:5050.
#
#   sudo cp deploy/nginx-ascent.conf /etc/nginx/conf.d/ascent.conf
#   sudo sed -i 's/YOUR_DOMAIN/dashboard.example.com/g' /etc/nginx/conf.d/ascent.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN     # rewrites the 443 block + adds renewal

upstream ascent_app {
    server 127.0.0.1:5050 fail_timeout=0;
    keepalive 8;
}

# Rate-limit the credential endpoint at the edge as well as in the app. The app's
# own throttle is per-process memory; this one survives app restarts and sheds the
# load before it ever reaches Python.
limit_req_zone $binary_remote_addr zone=ascent_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    # certbot needs this path over plain http; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Don't advertise the nginx version to scanners.
    server_tokens off;

    # Scans legitimately take 30–130s on a cold cache; the default 60s proxy read
    # timeout would cut them off and show the user a 504 mid-scan.
    proxy_read_timeout    310s;
    proxy_send_timeout    310s;
    proxy_connect_timeout 10s;

    client_max_body_size 2m;

    # The 680KB dashboard page compresses to a fraction of its size.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /opt/ascent/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /login {
        limit_req zone=ascent_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://ascent_app;
        include /etc/nginx/proxy_params;
        # Origin/host must survive the hop — the app's CSRF check compares Origin
        # against request.host, and ProxyFix reads these to rebuild the real client
        # IP and scheme. Getting X-Forwarded-Proto wrong breaks Secure cookies.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ascent_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
