# nginx site for Ascent Wealth Labs.
# Route53 A record -> this EC2's Elastic IP. No Cloudflare, so TLS terminates here
# and this is the only public listener; the app stays on 127.0.0.1:5050.
#
#   cp deploy/nginx-ascent.conf /etc/nginx/conf.d/ascent.conf
#   sed -i 's/YOUR_DOMAIN/jaiojha.link/g' /etc/nginx/conf.d/ascent.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR_DOMAIN --agree-tos -m you@example.com --redirect
#
# ── WHY THERE IS NO 443 BLOCK HERE (fixed 2026-08-04) ────────────────────────
# The first version of this file shipped a `listen 443 ssl` block with the
# ssl_certificate lines commented out, ready for certbot to fill in. That cannot
# work: nginx refuses to load a `listen ... ssl` server with no certificate, so
# `nginx -t` failed with
#     no "ssl_certificate" is defined for the "listen ... ssl" directive
# and certbot never got the chance to run — it needs nginx serving :80 to answer
# the HTTP-01 challenge. Chicken and egg.
#
# So this file defines port 80 ONLY. `certbot --nginx` then rewrites this server
# block in place: it adds the 443 listener, the certificate paths, and (with
# --redirect) a separate :80 block that 301s to https. Verified end to end on
# 2026-08-04 — cert issued and deployed to this file on the first attempt.

upstream ascent_app {
    server 127.0.0.1:5050 fail_timeout=0;
    keepalive 8;
}

# Rate-limit the credential endpoint at the edge as well as inside the app. The
# app's own throttle is per-process memory; this one survives restarts and sheds
# load before it reaches Python.
limit_req_zone $binary_remote_addr zone=ascent_login:10m rate=12r/m;

# Silences: "could not build optimal proxy_headers_hash". The first version also
# did `include /etc/nginx/proxy_params` AND set the same headers explicitly right
# below it, which is what pushed the hash over its bucket size. The include is
# gone; the explicit headers stay, because the app depends on them (see below).
proxy_headers_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    client_max_body_size 2m;

    # Scans legitimately take 30–130s on a cold cache; the default 60s proxy read
    # timeout would cut them off and hand the user a 504 mid-scan.
    proxy_read_timeout    310s;
    proxy_send_timeout    310s;
    proxy_connect_timeout 10s;

    # The dashboard page is ~680KB of HTML.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Proxied, NOT `alias /opt/ascent/static/`. Under Docker the static files live
    # inside the container, so a host path would 404 — the earlier version of this
    # file assumed the venv/systemd layout and silently broke CSS and JS.
    location /static/ {
        proxy_pass http://ascent_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /login {
        limit_req zone=ascent_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://ascent_app;
        # These three matter to the app, not just to logging: security.py compares
        # Origin against request.host for its CSRF check, and ProxyFix rebuilds the
        # real client IP and scheme from them. A wrong X-Forwarded-Proto makes the
        # session cookie Secure-but-unsent, i.e. login silently fails.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ascent_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
